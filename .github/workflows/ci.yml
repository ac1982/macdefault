name: Swift
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Test
        run: swift test --enable-code-coverage
      - name: Live harness timeout regression (no association changes)
        run: |
          swiftc -swift-version 6 -parse-as-library scripts/live-association-test.swift -o .build/live-association-test
          .build/live-association-test --self-test-timeout
      - name: Release build
        run: swift build -c release
      - name: Read-only smoke checks
        run: |
          .build/release/macdefault --version
          .build/release/macdefault --help
          .build/release/macdefault list txt --json
          .build/release/macdefault set txt --app com.apple.TextEdit --dry-run
