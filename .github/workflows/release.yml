name: Signed release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          swift format lint --strict --recursive Sources Tests Package.swift
          swift test
      - name: Build universal executable
        run: |
          swift build -c release --arch arm64 --arch x86_64
          binary_dir=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          mkdir -p release-package dist
          install -m 755 "$binary_dir/macdefault" release-package/macdefault
          test "$(release-package/macdefault --version)" = "$GITHUB_REF_NAME"
          lipo -archs release-package/macdefault | python3 -c 'import sys; assert set(sys.stdin.read().split()) == {"arm64", "x86_64"}'
          cp LICENSE README.md llms.txt release-package/
      - name: Sign, notarize, and verify
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bash scripts/sign-macos.sh release-package/macdefault \
            "dist/macdefault-${GITHUB_REF_NAME}-macos-universal.pkg" "$GITHUB_REF_NAME"
          release-package/macdefault --version
          release-package/macdefault list txt --json
          release-package/macdefault set txt --app com.apple.TextEdit --dry-run --json
          tar -C release-package -czf "dist/macdefault-${GITHUB_REF_NAME}-macos-universal.tar.gz" .
          (cd dist && shasum -a 256 *.pkg *.tar.gz > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "macdefault Swift $GITHUB_REF_NAME" --notes-file docs/release-notes.md --latest
